persona:
  name: Harvey
  company: Optywise
  role: Business Development
  email: harvey@optywise.com
  linkedin: linkedin.com/in/harvey-optywise-com
  tone: Direct, confident, engineering-led, no-fluff
product:
  name: Forward Deployment Engineering (FDE) with the PRISM Framework
  description: Optywise is a Forward Deployment Engineering firm that embeds senior
    AI/ML engineer pods inside client teams to take AI pilots to production in six
    weeks. It builds multi-agent systems, voice and chat agents, MCP integrations,
    RAG and model engineering on the client's own cloud and data. It serves enterprises
    and high-growth companies in the US and Canada, with a focus on insurance, healthcare
    RCM and fintech.
  pricing: Contact for pricing. Engagements are outcome-based (not hourly), scoped
    to one use case, one embedded pod and one six-week PRISM cycle, with a Statement
    of Work provided. The homepage cites an engagement shape of $60-150K. Detailed
    pricing via consulting@optywise.com.
  key_benefits:
  - AI pilot to production in 6 weeks with one embedded senior pod
  - You own all code, infrastructure, documentation and observability, so there is
    no vendor lock-in and capability is transferred rather than dependency created
  - Senior AI/ML engineers only, employed and managed by Optywise (not contractors
    or juniors)
  - Passes security and compliance review, with evals, guardrails and observability
    built in and work aligned toward HIPAA, SOC 2, NAIC and GDPR
  - Deployed in your environment on your cloud (AWS, Azure or Google Cloud) and wired
    into legacy systems and messy real data
  objection_responses:
    $60-150K is a lot for one use case, and we have no budget for this right now: Understood,
      and that's why it's scoped to one use case and one six-week cycle with a clear
      SOW, so you're paying for a production system you own rather than open-ended
      hours. What would a working AI agent in production need to save or earn for
      this to pencil out for your team?
    We can hire AI engineers in-house for less than that: Hiring senior AI/ML talent
      typically takes months and the first production system is often the hardest
      to get right, which is where an embedded pod shortens the path. Since we transfer
      code, docs and know-how, many teams use us to launch the first use case and
      then run it with their own hires. How long has your AI engineering search been
      open?
    We already work with a big consulting firm on our AI strategy: That's a good foundation,
      and we're not a replacement for strategy; we're usually the team that takes
      the roadmap from the deck to something live in production. Where does the current
      work stand when it comes to getting pilots actually deployed?
    We have a dev shop / outsourcing vendor we trust already: Loyalty to a vendor
      who delivers is worth respecting. The difference is that our senior pods work
      inside your repos and standups instead of building to a frozen spec, which tends
      to matter for AI where requirements shift as you learn from real data. Has your
      current vendor shipped AI work like agents or RAG into production yet?
    Staff augmentation or freelancers are cheaper per hour: On an hourly rate they
      often are, but you're also taking on the management, the seniority risk and
      the responsibility for getting to production. We're outcome-based with Optywise-employed
      senior engineers, so the measure is a live system, not hours billed. How has
      it gone when you've relied on contractors for AI work in the past?
    Our AI pilots are still in progress, so the timing isn't right: That's actually
      when teams often call us, since pilots that look good in a demo tend to stall
      when they hit security review, legacy systems and messy data. Where is your
      pilot today, and what's the biggest thing standing between it and production?
    Six weeks to production sounds unrealistic for our environment: It's a fair doubt,
      which is why each engagement is scoped to a single use case and the PRISM cycle
      builds in evals, guardrails and the Secure step from day one rather than leaving
      them for the end. Which use case would you want to test that against, and what
      usually slows your releases down?
    Our data is messy and our legacy systems are hard to integrate with: That's the
      norm for most of our clients in insurance, healthcare RCM and fintech, and wiring
      agents into legacy systems and real data is core to what we do rather than an
      edge case. Which systems would the first use case need to touch?
    We're worried about security, compliance and handing sensitive data to a third party: That
      concern is why we deploy in your own cloud (AWS, Azure or Google Cloud) and
      build in guardrails, observability and alignment toward HIPAA, SOC 2, NAIC and
      GDPR, so your data stays in your environment. Would it help to walk your security
      team through our approach before anything is scoped?
    We don't know you, and I haven't seen proof you can deliver in our industry: That's
      reasonable to want before committing, and our focus on regulated industries
      like insurance, healthcare RCM and fintech is deliberate. I'd be glad to share
      relevant examples and scope a small SOW so you can judge the work. What would
      you need to see to feel confident?
    We're worried about vendor lock-in and what happens when you leave: That's the
      reason we built the model around you owning all the code, infrastructure, documentation
      and observability, with capability transferred to your team so you need us less
      over time. What would your team need to feel comfortable running it on their
      own?
    I'm not sure AI agents are a priority or relevant to our business right now: Fair
      enough, and I wouldn't push it if there's no clear workload where it pays off.
      In many teams the case starts with a high-volume, manual process like claims
      intake, coding or customer calls; is there anything like that costing you time
      or money today?
