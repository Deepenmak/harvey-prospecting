# Apollo sourcing segments for `sellbird fetch`. Order = rotation order.
# Reasoning behind each segment: optywise_icp.md.

# Optional hard stop across all runs: fetch refuses to spend past it (the
# ledger is data/fetch_ledger.json, restored from the leads dashboard in
# cloud runs). 0 = no phase cap, so the only limit is the per-run budget
# below; set a number here to put the hard stop back.
phase_credit_cap: 0
# Default spend per run. One enrichment that finds an email = 1 credit.
per_run_credits: 10

# Free profile signals fetch collects on every company it enriches.
# Listing them here is the operator's confirmation (see sellbird signals).
confirm_signals: [HIRING_ROLE, OPEN_ROLES, TECH_STACK]

# Title order = who to pick first when a company has several matches.
# Champions (own the stuck workflow) before economic buyers.
#
# Keyword tags: Apollo's broad tags ("insurance", "financial services",
# "banking") match anyone who mentions the word, so "Head of AI" under them
# pulls in media, edtech, consultancies and AI vendors. Use the narrow tags,
# and lead with industry-specific titles (claims, underwriting, revenue
# cycle), which act as an industry filter of their own. Free search shows no
# industry, so this is the only guard before a credit is spent.
segments:
  - key: us_insurance
    label: US P&C and specialty carriers, MGAs, TPAs and insurtechs
    keyword_tags: [property & casualty insurance, insurance carrier, specialty insurance,
                   managing general agent, insurtech, third party administrator]
    locations: [united states]
    employees: ["200,5000"]
    seniorities: [c_suite, vp, head, director]
    titles: [Chief Claims Officer, VP Claims, Head of Claims, Head of Underwriting Operations,
             Chief Underwriting Officer, Head of Underwriting, Head of AI, Chief Digital Officer,
             Chief Innovation Officer, VP Engineering, Chief Information Officer,
             Chief Technology Officer, Chief Operating Officer]

  - key: uk_insurance
    label: UK and Ireland Lloyd's market, MGAs, specialty and general insurers
    keyword_tags: [lloyd's, specialty insurance, managing general agent, insurtech,
                   general insurance, reinsurance]
    locations: [united kingdom, ireland]
    employees: ["200,5000"]
    seniorities: [c_suite, vp, head, director]
    titles: [Head of Claims, Claims Director, Head of Underwriting, Underwriting Director,
             Head of AI, Chief Operating Officer, Chief Digital Officer,
             Chief Information Officer, Chief Technology Officer]

  - key: us_rcm
    label: US healthcare revenue cycle, medical billing and practice management
    keyword_tags: [revenue cycle management, medical billing, physician practice management]
    locations: [united states]
    employees: ["200,5000"]
    seniorities: [c_suite, vp, head, director]
    titles: [VP Revenue Cycle, Director of Revenue Cycle, Head of AI, VP Engineering,
             Chief Technology Officer, Chief Information Officer, Chief Operating Officer]

  - key: us_financial
    label: US community banks, large credit unions and lenders
    keyword_tags: [community banking, credit union, consumer lending, mortgage lending]
    locations: [united states]
    employees: ["200,5000"]
    seniorities: [c_suite, vp, head, director]
    titles: [Head of AI, Head of Operations, Head of Compliance, Chief Digital Officer,
             Chief Innovation Officer, VP Engineering, Chief Information Officer,
             Chief Technology Officer, Chief Operating Officer]

  - key: ca_insurance
    label: Canadian P&C, specialty and life insurers
    keyword_tags: [property & casualty insurance, insurance carrier, specialty insurance,
                   life insurance, managing general agent, insurtech]
    locations: [canada]
    employees: ["200,5000"]
    seniorities: [c_suite, vp, head, director]
    titles: [VP Claims, Head of Claims, Head of Underwriting, Chief Underwriting Officer,
             Head of AI, Chief Digital Officer, VP Engineering, Chief Information Officer,
             Chief Technology Officer, Chief Operating Officer]
