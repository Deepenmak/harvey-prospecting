services:
  sellbird:
    build: .
    restart: unless-stopped
    ports:
      - "5555:5555"
    volumes:
      - sellbird_data:/app/data
      - sellbird_exports:/app/exports
      # Claude Code credentials persist across restarts.
      # Authenticate once via Coolify terminal: 'claude login'
      - claude_home:/root/.claude
    environment:
      # ── Cloud deployment ──────────────────────────────────────────────────
      # Your public hostname (no protocol, no trailing slash).
      # Example: SELLBIRD_CLOUD_HOST=sellbird.optywise.com
      SELLBIRD_CLOUD_HOST: ${SELLBIRD_CLOUD_HOST}

      # Dashboard login credentials (set these in Coolify env vars)
      DASHBOARD_USER: ${DASHBOARD_USER}
      DASHBOARD_PASS: ${DASHBOARD_PASS}

      # ── API keys ─────────────────────────────────────────────────────────
      APOLLO_HARVEY_KEY: ${APOLLO_HARVEY_KEY}
      INSTANTLY_API_KEY: ${INSTANTLY_API_KEY:-}

      # Microsoft 365 OAuth (for mailbox)
      M365_CLIENT_ID: ${M365_CLIENT_ID:-}
      M365_TENANT_ID: ${M365_TENANT_ID:-}

      # Gmail OAuth (alternative mailbox)
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}

      # Optional enrichment / verification
      REOON_API_KEY: ${REOON_API_KEY:-}
      ZEROBOUNCE_API_KEY: ${ZEROBOUNCE_API_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}

volumes:
  sellbird_data:
  sellbird_exports:
  claude_home:
