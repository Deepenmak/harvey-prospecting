services:
  sellbird:
    build: .
    restart: unless-stopped
    ports:
      - "5555:5555"
    volumes:
      # Everything private and everything stateful lives here: sellbird.local.yaml,
      # .env, skills/, prompts/, data/sellbird.db and exports/. Nothing private is
      # in the image or in the (public) Git repo, and a redeploy never wipes it.
      # The Claude login is inside it too: the image sets
      # CLAUDE_CONFIG_DIR=/config/.claude, so 'claude login' is done once and
      # survives a redeploy. One volume, one place to back up.
      - sellbird_config:/config
    environment:
      # ── Cloud deployment ──────────────────────────────────────────────────
      # Your public hostname (no protocol, no trailing slash). Without it the
      # dashboard answers only to localhost and the public URL returns
      # "bad_host". Coolify shows the hostname on the resource's Domains field.
      SELLBIRD_CLOUD_HOST: ${SELLBIRD_CLOUD_HOST}

      # Dashboard sign-in. The app is on a public URL, so this is what stops
      # strangers reading your pipeline. Set the username and ONE of the two
      # passwords; both are listed here so whichever you fill in arrives.
      #
      #   DASHBOARD_PASS        the password itself. Always works, nothing can
      #                         mangle it, and it is the one to start with.
      #   DASHBOARD_PASS_HASH   from 'sellbird password-hash'. Better, because
      #                         the value here is then no use to whoever reads
      #                         it. Set it once the plain one works.
      #
      # A variable named here is one Coolify will not let you delete, which is
      # a nuisance for DASHBOARD_PASS once you have moved to a hash -- leave
      # it empty and it is ignored. That nuisance is worth far less than a
      # sign-in that silently stops arriving, which is what happened when this
      # file stopped naming it.
      DASHBOARD_USER: ${DASHBOARD_USER}
      DASHBOARD_PASS: ${DASHBOARD_PASS:-}
      DASHBOARD_PASS_HASH: ${DASHBOARD_PASS_HASH:-}

      # ── API keys ─────────────────────────────────────────────────────────
      # Optional here: all of these can also be typed into the dashboard's
      # Settings tab, which writes them to /config/.env on the volume.
      APOLLO_HARVEY_KEY: ${APOLLO_HARVEY_KEY:-}
      INSTANTLY_API_KEY: ${INSTANTLY_API_KEY:-}

      # Microsoft 365 OAuth (for mailbox)
      M365_CLIENT_ID: ${M365_CLIENT_ID:-}
      M365_TENANT_ID: ${M365_TENANT_ID:-}

      # Gmail OAuth (alternative mailbox)
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}

      # Optional enrichment / verification
      REOON_API_KEY: ${REOON_API_KEY:-}
      ZEROBOUNCE_API_KEY: ${ZEROBOUNCE_API_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}

volumes:
  sellbird_config:
