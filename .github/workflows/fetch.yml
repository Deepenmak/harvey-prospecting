# Daily Apollo prospect fetch. Runs on GitHub's servers, so it works with
# every laptop off. Spend is capped by segments.yaml, and the Google Sheet
# is the ledger that remembers what earlier runs spent and fetched.
name: prospect-fetch

on:
  schedule:
    - cron: "30 1 * * 1-5"   # 07:00 IST (01:30 UTC), Monday to Friday
  workflow_dispatch:
    inputs:
      segment:
        description: "Segment key from segments.yaml, or auto"
        default: "auto"
      credits:
        description: "Max credits this run (blank = per_run_credits)"
        default: ""

permissions:
  contents: read

concurrency:
  group: prospect-fetch
  cancel-in-progress: false

jobs:
  fetch:
    if: github.repository != 'ethanplusai/sellbird'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Fetch
        env:
          APOLLO_HARVEY_KEY: ${{ secrets.APOLLO_HARVEY_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          SEGMENT: ${{ inputs.segment || 'auto' }}
          CREDITS: ${{ inputs.credits }}
        run: |
          args="--segment $SEGMENT --json"
          if [ -n "$CREDITS" ]; then args="$args --credits $CREDITS"; fi
          sellbird fetch $args | tee fetch-report.json
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("fetch-report.json"))
          print(f"### Fetch: {r['segment']}")
          if r.get("stopped"):
              print(f"Stopped: {r['stopped']}")
          else:
              print(f"Searched {r['searched']}, enriched {r['enriched']}, "
                    f"prospects {r['prospects']}, credits used {r['credits_used']}, "
                    f"left {r['credits_left']}")
          EOF
      - name: Keep the CSV for a week (backup if the sheet push failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-${{ github.run_id }}
          path: exports/*.csv
          retention-days: 7
          if-no-files-found: ignore
